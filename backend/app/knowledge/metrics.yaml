metrics:
  - name: 营业收入
    aliases: [收入, 销售额, 营收]
    description: 扣除退货后的含税销售收入
    formula: SUM(sales_fact.revenue)
    grain: 月-产品-区域
    owner: 财务中心
    version: v1.2
    dimensions: [月份, 产品, 区域]
  - name: 销售成本
    aliases: [成本, 主营业务成本]
    description: 与已销售产品对应的标准成本与成本调整之和
    formula: SUM(sales_fact.cost)
    grain: 月-产品-区域
    owner: 财务中心
    version: v1.1
    dimensions: [月份, 产品, 区域]
  - name: 毛利润
    aliases: [毛利, 销售毛利]
    description: 营业收入减销售成本
    formula: SUM(sales_fact.revenue) - SUM(sales_fact.cost)
    grain: 月-产品-区域
    owner: 财务中心
    version: v2.0
    dimensions: [月份, 产品, 区域]
  - name: 毛利率
    aliases: [利润率]
    description: 毛利润占营业收入比例，必须先汇总分子分母再相除
    formula: (SUM(sales_fact.revenue)-SUM(sales_fact.cost))/NULLIF(SUM(sales_fact.revenue),0)
    grain: 月-产品-区域
    owner: 财务中心
    version: v2.0
    dimensions: [月份, 产品, 区域]
    forbidden_aggregations: [AVG(row_margin_rate)]
  - name: 销量
    aliases: [销售数量, 件数]
    description: 完成销售的产品数量
    formula: SUM(sales_fact.quantity)
    grain: 月-产品-区域
    owner: 销售中心
    version: v1.0
    dimensions: [月份, 产品, 区域]

